<br><br>

        <br><br>
        <button onclick="tot()">Calculate</button>

<script>

function tot() {
	const grades = document.querySelectorAll(".letter");
	const units = [2,8,6,2,1,2,1];

	let totalgradez = 0;
	let totalunitz = 0;

	grades.forEach((grade, index) => {

		let gradept = parseFloat(grade.value);
		let subjunit = units[index];

		totalgradez += gradept * subjunit;
		totalunitz += subjunit;
	}

);
	const qpi = totalgradez/totalunitz;

	let dlpl = "";
	let img = "";

	    if (qpi >= 3.70) {
	        dlpl = "President's Lister";
	        img = "pl.jpg";
	    }
	    else if (qpi >= 3.40 && qpi < 3.70) {
	        dlpl = "Dean's Lister";
	        img = "dl.png";
	    }
	    else {
	        dlpl = "Good job :3";
	        img = "gj.jpg"
	    }


	document.getElementById("result").innerHTML = "TOTAL QPI: " + qpi.toFixed(2) +
        "<br><br>" + dlpl + '<img src="' + img + '" alt="' + dlpl + '">';
}


function Clear() {
	   document.querySelectorAll(".letter").forEach(grade => {
        grade.selectedIndex = 0;
    });


    document.getElementById("result").innerHTML = "TOTAL:";
}
	


</script>
